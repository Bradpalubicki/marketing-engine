phases:
  - id: "0"
    name: Assessment
    status: complete
  - id: "1"
    name: Deep Review
    status: complete
  - id: "2"
    name: Fix All Issues
    status: in_progress
  - id: "3"
    name: Enhance
    status: pending
  - id: "4"
